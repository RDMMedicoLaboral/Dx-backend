# Blueprint de Render para el backend. La base de datos NO se crea aquí:
# usamos Neon (Postgres externo) — pega su cadena de conexión como DATABASE_URL
# manualmente en el dashboard de Render después de crear el servicio (Render no
# permite guardar secretos ajenos en este archivo).

services:
  - type: web
    name: diagnostic-os-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # pégala tú: la cadena de conexión que te da Neon
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://TU-USUARIO.github.io"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NODE_ENV
        value: production
