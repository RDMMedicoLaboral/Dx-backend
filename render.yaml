# Blueprint de Render. La base de datos NO se crea aquí: usamos Neon (Postgres
# externo) — pega su cadena de conexión como DATABASE_URL en el dashboard de
# Render (Render no permite guardar secretos ajenos en este archivo).
#
# Nota sobre "rootDir": bórrala o déjala vacía si tu repositorio de GitHub
# contiene package.json, prisma/, src/... directamente en la raíz (como
# Dx-backend). Solo úsala si subiste el proyecto completo (frontend + backend
# juntos) y el backend está en una subcarpeta.

services:
  - type: web
    name: diagnostic-os-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # pégala tú: la cadena de conexión que te da Neon
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://TU-USUARIO.github.io"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SEED_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
